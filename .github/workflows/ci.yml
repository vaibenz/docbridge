name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docbridge
          POSTGRES_PASSWORD: docbridge
          POSTGRES_DB: docbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docbridge"
          --health-interval 2s
          --health-retries 20
    env:
      DOCBRIDGE_DATABASE_URL: postgresql://docbridge:docbridge@localhost:5432/docbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Evaluation on pgvector (offline models)
        run: docbridge eval eval/questions.jsonl --out eval/report-ci.md
      - name: Prompt injection red team (offline models)
        run: docbridge redteam --out redteam/report-ci.md
      - name: Retrieval benchmark on SQuAD 2.0 (offline retrievers)
        run: python bench/squad.py --out bench/results-ci.md
